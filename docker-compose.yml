services:
  examiner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-personal-examiner
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/examiner.db
    volumes:
      - examiner_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  examiner_data:
    name: examiner_data
